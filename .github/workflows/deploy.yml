name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python modules
        run: python -m compileall -q backend-web common websocket scheduler launcher

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  deploy:
    name: Deploy to server
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/xianyu-auto-reply' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure SSH host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          if [[ -n "${DEPLOY_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Sync repository and restart services
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS=(-p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10)
          ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          cd "$DEPLOY_PATH"
          export COMPOSE_PROJECT_NAME=xianyu-auto-reply

          git fetch origin main
          git reset --hard origin/main

          if [ -f .env ]; then
            sed -i -E 's|^MYSQL_IMAGE=.*aliyuncs.com/.*$|MYSQL_IMAGE=mysql:8.0|' .env || true
            sed -i -E 's|^REDIS_IMAGE=.*aliyuncs.com/.*$|REDIS_IMAGE=redis:7-alpine|' .env || true
          fi

          if [ -f docker-compose.deploy.yml ]; then
            COMPOSE_FILE=docker-compose.deploy.yml
          elif [ -f docker-compose.remote.yml ]; then
            COMPOSE_FILE=docker-compose.remote.yml
          else
            COMPOSE_FILE=docker-compose.yml
          fi

          if [ -f .env ]; then
            ENV_ARGS=(--env-file .env)
          elif [ -f .env.remote ]; then
            ENV_ARGS=(--env-file .env.remote)
          else
            ENV_ARGS=()
          fi

          if docker compose version >/dev/null 2>&1; then
            DC=(docker compose)
          else
            DC=(docker-compose)
          fi

          if grep -qE '^[[:space:]]+build:' "$COMPOSE_FILE"; then
            "${DC[@]}" -f "$COMPOSE_FILE" "${ENV_ARGS[@]}" up -d --build --remove-orphans
          else
            printf 'Compose file %s has no build definitions; refusing registry-only deployment.\n' "$COMPOSE_FILE" >&2
            exit 1
          fi

          docker image prune -f
          REMOTE_SCRIPT
